[profile.default]
via_ir = true
optimizer = true
optimizer_runs = 466
bytecode_hash = "none"
evm_version = "osaka"
fs_permissions = [{ access = "read", path = "test/ticks_exact.json" }]

# Compile the Log periphery contract with the maximum optimizer_runs.
[[profile.default.additional_compiler_profiles]]
name = "log"
via_ir = true
optimizer = true
optimizer_runs = 4294967295
bytecode_hash = "None"
evm_version = "osaka"

[[profile.default.compilation_restrictions]]
paths = "src/periphery/Log.sol"
optimizer_runs = 4294967295

[profile.default.fmt]
wrap_comments = true

[lint]
exclude_lints = [
    "asm-keccak256",
    "unsafe-cheatcode",
    "incorrect-shift",
    "block-timestamp",
]
