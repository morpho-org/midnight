[profile.default]
via_ir = true
optimizer = true
optimizer_runs = 466
bytecode_hash = "none"
evm_version = "osaka"
fs_permissions = [
    { access = "read", path = "test/ticks_exact.json" },
    { access = "read", path = "out/Morpho.sol/Morpho.json" },
]

[profile.default.fmt]
wrap_comments = true

[lint]
exclude_lints = [
    "asm-keccak256",
    "unsafe-cheatcode",
    "incorrect-shift",
    "block-timestamp",
    "internal-function-used-once",
    "pragma-inconsistent",
    "missing-zero-check",
    "low-level-calls",
    "inline-assembly",
    "literal-instead-of-constant",
    "require-revert-in-loop",
    "multi-contract-file",
    "calls-loop",
    "arbitrary-send-erc20",
    "unused-return",
    "cyclomatic-complexity",
]

# Lint profile for test/: excludes every rule that currently fires there, so tests
# stay linted. Starting point to be trimmed, the bug-class rules first.
[profile.lint-test.lint]
exclude_lints = [
    "literal-instead-of-constant",
    "unused-return",
    "reentrancy-events",
    "divide-before-multiply",
    "calls-loop",
    "multi-contract-file",
    "missing-inheritance",
    "reentrancy-no-eth",
    "internal-function-used-once",
    "low-level-calls",
    "unsafe-typecast",
    "function-init-state",
    "missing-zero-check",
    "uninitialized-state",
    "missing-events-access-control",
    "uninitialized-local",
    "named-struct-fields",
    "empty-block",
    "arbitrary-send-erc20",
    "boolean-cst",
    "ecrecover",
    "inline-assembly",
    "unused-import",
    "boolean-equal",
    "encode-packed-collision",
    "require-revert-in-loop",
    # Excluded repo-wide by the base [lint] block; repeated here because a profile
    # replaces that array rather than extending it.
    "asm-keccak256",
    "unsafe-cheatcode",
    "incorrect-shift",
    "block-timestamp",
]

[[profile.default.compilation_restrictions]]
paths = "test/imports/MorphoImport.sol"
optimizer_runs = 999999
evm_version = "paris"

[[profile.default.additional_compiler_profiles]]
name = "999999-paris"
optimizer_runs = 999999
evm_version = "paris"
