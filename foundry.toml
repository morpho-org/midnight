[profile.default]
via_ir = true
optimizer = true
optimizer_runs = 466
bytecode_hash = "none"
evm_version = "osaka"
fs_permissions = [
    { access = "read", path = "test/ticks_exact.json" },
    { access = "read", path = "out/Morpho.sol/Morpho.json" },
]

[lint]
exclude_lints = [
    "arbitrary-send-erc20",
    "arbitrary-send-eth",
    "asm-keccak256",
    "block-timestamp",
    "boolean-cst",
    "calls-loop",
    "costly-loop",
    "custom-errors",
    "cyclomatic-complexity",
    "divide-before-multiply",
    "ecrecover",
    "encode-packed-collision",
    "erc20-unchecked-transfer",
    "incorrect-shift",
    "inline-assembly",
    "internal-function-used-once",
    "literal-instead-of-constant",
    "low-level-calls",
    "missing-events-access-control",
    "missing-zero-check",
    "mixed-case-variable",
    "multi-contract-file",
    "pragma-inconsistent",
    "reentrancy-events",
    "reentrancy-no-eth",
    "require-revert-in-loop",
    "screaming-snake-case-const",
    "screaming-snake-case-immutable",
    "solmate-safe-transfer-lib",
    "too-many-digits",
    "unaliased-plain-import",
    "uninitialized-local",
    "unsafe-cheatcode",
    "unsafe-typecast",
    "unused-import",
    "unused-return",
    "unwrapped-modifier-logic",
]

# Lint profile for test/: the base list in full, plus the rules that only fire in
# test/. A profile replaces exclude_lints rather than extending it, hence the repeat.
# Starting point to be trimmed, the bug-class rules first.
# Lint test/ as ordinary Solidity instead of applying Forge's test-only rule filter.
[profile.lint-test]
test = ".forge-lint-unused"

[profile.lint-test.lint]
exclude_lints = [
    "arbitrary-send-erc20",
    "arbitrary-send-eth",
    "asm-keccak256",
    "block-timestamp",
    "boolean-cst",
    "calls-loop",
    "costly-loop",
    "custom-errors",
    "cyclomatic-complexity",
    "divide-before-multiply",
    "ecrecover",
    "empty-block",
    "encode-packed-collision",
    "environment-read-across-mutation",
    "erc20-unchecked-transfer",
    "function-init-state",
    "incorrect-shift",
    "inline-assembly",
    "internal-function-used-once",
    "literal-instead-of-constant",
    "locked-ether",
    "low-level-calls",
    "missing-events-access-control",
    "missing-inheritance",
    "missing-zero-check",
    "mixed-case-variable",
    "multi-contract-file",
    "named-struct-fields",
    "pragma-inconsistent",
    "reentrancy-events",
    "reentrancy-no-eth",
    "require-revert-in-loop",
    "return-bomb",
    "screaming-snake-case-const",
    "screaming-snake-case-immutable",
    "solmate-safe-transfer-lib",
    "too-many-digits",
    "unaliased-plain-import",
    "uninitialized-local",
    "uninitialized-state",
    "unsafe-cheatcode",
    "unsafe-typecast",
    "unused-import",
    "unused-return",
    "unwrapped-modifier-logic",
]

[[profile.default.compilation_restrictions]]
paths = "test/imports/MorphoImport.sol"
optimizer_runs = 999999
evm_version = "paris"

[[profile.default.additional_compiler_profiles]]
name = "999999-paris"
optimizer_runs = 999999
evm_version = "paris"
