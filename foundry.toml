[profile.default]
via_ir = true
optimizer = true
optimizer_runs = 466
bytecode_hash = "none"
evm_version = "osaka"
fs_permissions = [
    { access = "read", path = "test/ticks_exact.json" },
    { access = "read", path = "out/Morpho.sol/Morpho.json" },
]

[profile.default.fmt]
wrap_comments = true

[lint]
exclude_lints = [
    "asm-keccak256",
    "unsafe-cheatcode",
    "incorrect-shift",
    "block-timestamp",
    "internal-function-used-once",
    "pragma-inconsistent",
    "missing-zero-check",
    "low-level-calls",
    "inline-assembly",
    "literal-instead-of-constant",
    "require-revert-in-loop",
    "multi-contract-file",
    "calls-loop",
    "arbitrary-send-erc20",
    "unused-return",
    "cyclomatic-complexity",
]

[[profile.default.compilation_restrictions]]
paths = "test/imports/MorphoImport.sol"
optimizer_runs = 999999
evm_version = "paris"

[[profile.default.additional_compiler_profiles]]
name = "999999-paris"
optimizer_runs = 999999
evm_version = "paris"
