[profile.default]
via_ir = true
optimizer = true
optimizer_runs = 466
bytecode_hash = "none"
evm_version = "osaka"
fs_permissions = [
    { access = "read", path = "test/ticks_exact.json" },
    { access = "read", path = "out/Morpho.sol/Morpho.json" },
]

[profile.default.fmt]
wrap_comments = true

[lint]
exclude_lints = [
    "asm-keccak256",
    "unsafe-cheatcode",
    "incorrect-shift",
    "block-timestamp",
    "internal-function-used-once",
    "pragma-inconsistent",
    "missing-zero-check",
    "low-level-calls",
    "inline-assembly",
    "literal-instead-of-constant",
    "require-revert-in-loop",
    "multi-contract-file",
    "calls-loop",
    "arbitrary-send-erc20",
    "unused-return",
    "cyclomatic-complexity",
    "boolean-cst",
    "uninitialized-local",
]

# Lint profile for test/: the base list in full, plus the rules that only fire in
# test/. A profile replaces exclude_lints rather than extending it, hence the repeat.
# Starting point to be trimmed, the bug-class rules first.
[profile.lint-test.lint]
exclude_lints = [
    # Base [lint] list, repeated in full.
    "asm-keccak256",
    "unsafe-cheatcode",
    "incorrect-shift",
    "block-timestamp",
    "internal-function-used-once",
    "pragma-inconsistent",
    "missing-zero-check",
    "low-level-calls",
    "inline-assembly",
    "literal-instead-of-constant",
    "require-revert-in-loop",
    "multi-contract-file",
    "calls-loop",
    "arbitrary-send-erc20",
    "unused-return",
    "cyclomatic-complexity",
    "boolean-cst",
    "uninitialized-local",
    # Additionally firing under test/.
    "reentrancy-events",
    "divide-before-multiply",
    "missing-inheritance",
    "reentrancy-no-eth",
    "unsafe-typecast",
    "function-init-state",
    "missing-events-access-control",
    "named-struct-fields",
    "empty-block",
]

[[profile.default.compilation_restrictions]]
paths = "test/imports/MorphoImport.sol"
optimizer_runs = 999999
evm_version = "paris"

[[profile.default.additional_compiler_profiles]]
name = "999999-paris"
optimizer_runs = 999999
evm_version = "paris"
