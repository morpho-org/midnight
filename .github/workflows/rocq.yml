name: rocq

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Check proofs and assumptions
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" rocq/rocq-prover@sha256:b85a80a11bb65c7c843f91c7cbcce282f22ee397c9ca42f123d568ab6cef68b0 sh -lc '
            # Assume .v files are independent.
            # Do not check admits in the module'\''s dependencies.
            for file in rocq/*.v; do
              module="$(basename "$file" .v)"
              rocq compile -o "/tmp/$module.vo" "$file"
              output="$(rocq check -silent --output-context "/tmp/$module.vo" 2>&1)"
              if printf '%s\n' "$output" | grep -F "    $module."; then
                exit 1
              fi
            done
          '
