name: Forge

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  fmt:
    name: format
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: nightly

      - name: Check formatting
        run: forge fmt src test certora --check

  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: nightly

      - name: Run forge lint
        run: forge lint src certora --deny notes

      - name: Run forge lint on tests
        run: forge lint test --deny notes

  build:
    name: sizes
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: nightly

      - name: Run forge build
        run: forge build --sizes

      - name: Check foundry.lock matches submodule pins
        run: forge build --locked

  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - token-type: 0
            name: standard
          - token-type: 1
            name: no-revert
          - token-type: 2
            name: usdt
          - token-type: 3
            name: revert-to-zero
          - token-type: 4
            name: no-return
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: nightly
      - name: Run Forge tests (${{ matrix.name }})
        run: forge test --deny warnings -vvv
        env:
          FOUNDRY_FUZZ_SEED: 0x${{ github.sha }}
          TOKEN_TYPE: ${{ matrix.token-type }}
