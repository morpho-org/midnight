name: certora

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      confs: ${{ steps.list.outputs.confs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "confs=$(find certora/confs -type f -name '*.conf' | sed 's|^certora/confs/||;s|\.conf$||' | sort | jq -nRc '[inputs]')" >> "$GITHUB_OUTPUT"

  format:
    name: Certora formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ">=3.15.2"
      - run: pip install certora-cli==8.20.3
      - name: Check every config and spec, including shared helpers
        run: |
          formatted="$(mktemp)"
          trap 'rm -f "$formatted"' EXIT
          while IFS= read -r -d '' file; do
            jq . "$file" > "$formatted"
            diff -u "$file" "$formatted"
          done < <(find certora/confs -type f -name '*.conf' -print0 | sort -z)
          while IFS= read -r -d '' file; do
            certoraCVLFormatter "$file" | sed 's/[[:blank:]]*$//' > "$formatted"
            diff -u "$file" "$formatted"
          done < <(find certora -type f -name '*.spec' -print0 | sort -z)

  verify:
    needs: [matrix, format]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        conf: ${{ fromJson(needs.matrix.outputs.confs) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ">=3.15.2"

      - name: Install certora
        run: pip install certora-cli==8.20.3

      - name: Install solc (0.8.34)
        env:
          EXPECTED_SOLC_SHA256: d40adc6f9fdbb22a97d32a02fa05688bf2ee7886affc48c9851b0afd4a726b39
        run: |
          wget https://github.com/ethereum/solidity/releases/download/v0.8.34/solc-static-linux
          actual="$(sha256sum solc-static-linux | awk '{print $1}')"
          [ "$actual" = "$EXPECTED_SOLC_SHA256" ] || { echo "solc hash mismatch"; exit 1; }
          chmod +x solc-static-linux
          sudo mv solc-static-linux /usr/local/bin/solc-0.8.34

      - name: Verify ${{ matrix.conf }}
        run: certoraRun "certora/confs/$CONF.conf"
        env:
          CONF: ${{ matrix.conf }}
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
