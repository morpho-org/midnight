name: Certora

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  matrix:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      confs: ${{ steps.list.outputs.confs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "confs=$(find certora/confs -type f -name '*.conf' | sed 's|^certora/confs/||;s|\.conf$||' | sort | jq -nRc '[inputs]')" >> "$GITHUB_OUTPUT"

  format:
    permissions:
      contents: read
    name: Certora formatting
    runs-on: ubuntu-latest
    steps:
      - name: Use Java 21
        run: echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: pip install certora-cli
      - name: Run Certora Config Linter
        run: |
          find certora/confs -type f -name '*.conf' | sort |
          while read -r file; do
            jq . "$file" | diff -u "$file" -
          done
      - name: Run Certora Specs Linter
        run: |
          find certora -type f -name '*.spec' | sort |
          while read -r file; do
            certoraCVLFormatter "$file" | diff -u "$file" -
          done

  verify:
    permissions:
      contents: read
    needs: [matrix, format]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        conf: ${{ fromJson(needs.matrix.outputs.confs) }}

    steps:
      - name: Use Java 21
        run: echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"

      # Certora does not use lib/, so submodules are not checked out.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install certora
        run: pip install certora-cli

      - name: Install solc (0.8.34)
        run: |
          wget https://github.com/ethereum/solidity/releases/download/v0.8.34/solc-static-linux
          echo "d40adc6f9fdbb22a97d32a02fa05688bf2ee7886affc48c9851b0afd4a726b39  solc-static-linux" | sha256sum --check --strict
          chmod +x solc-static-linux
          sudo mv solc-static-linux /usr/local/bin/solc-0.8.34

      - name: Verify ${{ matrix.conf }} specification
        run: certoraRun "certora/confs/$CONF.conf"
        env:
          CONF: ${{ matrix.conf }}
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
