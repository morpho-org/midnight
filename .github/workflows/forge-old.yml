name: forge-old

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  compare-bytecode:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive
      - name: Install Foundry (old)
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.5.1
      - name: Verify forge executable hash
        env:
          EXPECTED_FORGE_SHA256: a39fc1913b53dde6a35b603756f65d799e13817ef694107ec0d3704c20435cce
        run: |
          forge_path="$(which forge)"
          echo "forge path: $forge_path"
          actual="$(sha256sum "$forge_path" | awk '{print $1}')"
          echo "actual:   $actual"
          echo "expected: $EXPECTED_FORGE_SHA256"
          [ "$actual" = "$EXPECTED_FORGE_SHA256" ] || { echo "forge hash mismatch"; exit 1; }
      - name: Install solc 0.8.34 into svm cache
        run: |
          mkdir -p "$HOME/.svm/0.8.34"
          curl -fsSL -o "$HOME/.svm/0.8.34/solc-0.8.34" \
            https://github.com/ethereum/solidity/releases/download/v0.8.34/solc-static-linux
          chmod +x "$HOME/.svm/0.8.34/solc-0.8.34"
          "$HOME/.svm/0.8.34/solc-0.8.34" --version
      - name: Build with Foundry (old)
        run: forge build --force
      - name: Export bytecode manifest (old)
        run: |
          mkdir -p compare
          find out -name '*.json' -print0 | while IFS= read -r -d '' file; do
            target="$(jq -r '((.metadata.settings.compilationTarget // {}) | keys[0]) // .ast.absolutePath // empty' "$file")"
            case "$target" in src/*) ;; *) continue ;; esac
            name="$(jq -r '((.metadata.settings.compilationTarget // {}) | to_entries[0].value) // empty' "$file")"
            [ -n "$name" ] || name="$(basename "$file" .json)"
            jq -r --arg rel "$target:$name" '[$rel, (.bytecode.object // ""), (.deployedBytecode.object // "")] | @tsv' "$file"
          done | sort > compare/old.tsv
          [ -s compare/old.tsv ] || { echo "old manifest is empty (no src/ artifact carried a source path)"; exit 1; }
          if grep -qv '^src/' compare/old.tsv; then
            echo "old manifest contains non-src artifacts:"; grep -v '^src/' compare/old.tsv | cut -f1; exit 1
          fi
          echo "old manifest: $(wc -l < compare/old.tsv) src/ artifacts"
      - name: Run Forge tests
        run: forge test
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      - name: Build with Foundry
        run: forge build --force --out out-new --cache-path cache-new
      - name: Export bytecode manifest (new)
        run: |
          find out-new -name '*.json' -print0 | while IFS= read -r -d '' file; do
            target="$(jq -r '((.metadata.settings.compilationTarget // {}) | keys[0]) // .ast.absolutePath // empty' "$file")"
            case "$target" in src/*) ;; *) continue ;; esac
            name="$(jq -r '((.metadata.settings.compilationTarget // {}) | to_entries[0].value) // empty' "$file")"
            [ -n "$name" ] || name="$(basename "$file" .json)"
            jq -r --arg rel "$target:$name" '[$rel, (.bytecode.object // ""), (.deployedBytecode.object // "")] | @tsv' "$file"
          done | sort > compare/new.tsv
          [ -s compare/new.tsv ] || { echo "new manifest is empty (no src/ artifact carried a source path)"; exit 1; }
          if grep -qv '^src/' compare/new.tsv; then
            echo "new manifest contains non-src artifacts:"; grep -v '^src/' compare/new.tsv | cut -f1; exit 1
          fi
          echo "new manifest: $(wc -l < compare/new.tsv) src/ artifacts"
      - name: Compare bytecode
        run: diff -u compare/old.tsv compare/new.tsv
