name: Forge old

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  test:
    name: Forge old tests
    outputs:
      matrix-size: ${{ strategy.job-total }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - token-type: 0
            name: standard
          - token-type: 1
            name: no-revert
          - token-type: 2
            name: usdt
          - token-type: 3
            name: revert-to-zero
          - token-type: 4
            name: no-return
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Foundry (old)
        run: |
          curl -fsSL -o foundry.tar.gz https://github.com/foundry-rs/foundry/releases/download/v1.8.3/foundry_v1.8.3_linux_amd64.tar.gz
          echo "7ca48e6ca3cac1bce1403ca67e5bc1dc3bc1fd818199c9957c7165079c228568  foundry.tar.gz" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/foundry"
          tar -xzf foundry.tar.gz -C "$RUNNER_TEMP/foundry"
          echo "$RUNNER_TEMP/foundry" >> "$GITHUB_PATH"
      - name: Install solc into svm cache
        run: |
          echo "0.8.19 7a5c1d3dc9a8eba62bb2ec37192c9178ae5fe8a54a56e5573fd3c9c17cd9eb48
          0.8.34 d40adc6f9fdbb22a97d32a02fa05688bf2ee7886affc48c9851b0afd4a726b39" |
          while read -r version sha256; do
            solc="$HOME/.svm/$version/solc-$version"
            mkdir -p "${solc%/*}"
            curl -fsSL -o "$solc" "https://github.com/ethereum/solidity/releases/download/v$version/solc-static-linux"
            echo "$sha256  $solc" | sha256sum --check --strict
            chmod +x "$solc"
          done
      - name: Run Forge tests
        run: forge test --offline -vvv
        env:
          FOUNDRY_FUZZ_SEED: 0x${{ github.sha }}
          TOKEN_TYPE: ${{ matrix.token-type }}

  # Same check name as in the other repos.
  forge-old:
    permissions:
      contents: read
      actions: read
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Require every legacy test combination
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_TESTS: ${{ needs.test.outputs.matrix-size }}
        run: |
          # Partial reruns can hide earlier failures in needs.test.result.
          gh api --paginate \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?filter=all&per_page=100" |
            jq --slurp --exit-status --argjson expected "$EXPECTED_TESTS" '
              [.[].jobs[] | select(.name | startswith("Forge old tests ("))]
              | group_by(.name) | map(max_by(.run_attempt))
              | length == $expected and all(.conclusion == "success")
            '
