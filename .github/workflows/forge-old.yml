name: forge-old

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - token-type: 0
            name: standard
          - token-type: 1
            name: no-revert
          - token-type: 2
            name: usdt
          - token-type: 3
            name: revert-to-zero
          - token-type: 4
            name: no-return
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Foundry (old)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly-a44159a5c23d2699d3a390e6d4889b89a0e5a5e0
      - name: Verify forge executable hash
        env:
          EXPECTED_FORGE_SHA256: 9366cb6647524cac03f6e7257e773eb6389d613c86fd0c47a5f523f1616cd23a
        run: |
          forge_path="$(which forge)"
          echo "forge path: $forge_path"
          actual="$(sha256sum "$forge_path" | awk '{print $1}')"
          echo "actual:   $actual"
          echo "expected: $EXPECTED_FORGE_SHA256"
          [ "$actual" = "$EXPECTED_FORGE_SHA256" ] || { echo "forge hash mismatch"; exit 1; }
      - name: Run Forge tests (${{ matrix.name }})
        run: forge test
        env:
          TOKEN_TYPE: ${{ matrix.token-type }}
